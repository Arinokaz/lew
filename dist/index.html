    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-4);
        background: var(--color-bg);
        z-index: var(--z-modal);
        transition: opacity var(--transition-slow);
      }
      .splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash__title {
        font-size: var(--font-size-3xl);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
    </style>

  <body>
    <div id="app">
      <div class="splash" id="splash">
        <div class="splash__title">LEW</div>
        <div class="spinner" aria-label="Загрузка"></div>
      </div>
    </div>

    <script type="module" src="./lew.bundle.js"></script>
